[package]
name = "brush-core"
description = "Reusable core of a POSIX/bash shell (used by brush-shell)"
version = "0.5.0"
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde", "brush-parser/serde", "rpds/serde", "chrono/serde"]
experimental-parser = ["brush-parser/winnow-parser"]

[dependencies]
async-recursion = "1.1.1"
async-trait = "0.1.89"
brush-parser = { version = "^0.4.0", path = "../brush-parser" }
bon = "3.9.1"
cfg-if = "1.0.4"
# METAL: no `wasmbind` (JS glue on wasm32-unknown-unknown); the clock comes from sys::time.
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.0", features = ["derive", "wrap_help"] }
color-print = "0.3.7"
fancy-regex = "0.17.0"
futures = "0.3.32"
inherent = "1.0.13"
itertools = "0.14.0"
normalize-path = "0.2.1"
# METAL: no OS randomness on wasm32-unknown-unknown (see wellknownvars::random).
rand = { version = "0.10.0", default-features = false, features = ["std", "std_rng"] }
rpds = "1.2.0"
serde = { version = "1.0.228", optional = true, features = ["derive"] }
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"
tracing = "0.1.44"

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1.52.1", features = ["io-util", "macros", "rt", "sync"] }

[target.'cfg(any(unix, windows))'.dependencies]
rand = { version = "0.10.0", features = ["thread_rng"] }
hostname = "0.4.2"
tokio = { version = "1.50.0", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
] }

[target.'cfg(windows)'.dependencies]
check_elevation = "0.2.7"
whoami = "2.1.1"

[target.'cfg(unix)'.dependencies]
command-fds = "0.3.2"
libc = "0.2.183"
nix = { version = "0.31.2", features = [
    "fs",
    "poll",
    "process",
    "resource",
    "signal",
    "term",
    "user",
] }
terminfo = "0.9.0"
uzers = "0.12.2"


[dev-dependencies]
anyhow = "1.0.102"
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
tempfile = "3.27.0"

# METAL: memoization only on native targets; on Wasm, `cached` pulls in wasm-bindgen (JS glue,
# via web-time), which a WebAssembly component without a JS host can't import.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
cached = "0.59.0"
